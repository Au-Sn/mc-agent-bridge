# MC Agent Bridge 配置 —— 「真动手」模式（dry_run=false）
# 用法（游戏内计算机里）：
#   wget http://<网关IP>:8765/files/bridge-live.cfg bridge.cfg
# 然后重启程序：Ctrl+T  →  wget run http://<网关IP>:8765/files/agent_bridge.lua
#
# ⚠ dry_run=false 表示：会真正改动世界（含海龟的挖掘/移动，不可逆）。
#    想回到"只读演练"模式，用同目录的 bridge-dry.cfg 覆盖回来即可。
gateway=http://127.0.0.1:8765
who=mine1
dry_run=false
poll_ms=500
report_every=10
rednet_chan=4200
