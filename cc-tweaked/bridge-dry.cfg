# MC Agent Bridge 配置 —— 「只读演练」模式（dry_run=true）
# 用法（游戏内计算机里）：
#   wget http://<网关IP>:8765/files/bridge-dry.cfg bridge.cfg
# 然后重启程序：Ctrl+T  →  wget run http://<网关IP>:8765/files/agent_bridge.lua
#
# 这是默认模式：所有只读指令（status/scan/players/block_info/player_pos/
# peripheral_api/discover_turtles 等）照常执行，但**一切会改动世界的动作**
# ——包括转发给海龟的指令——都会被拦下，只回报 would_dispatch。
gateway=http://127.0.0.1:8765
who=mine1
dry_run=true
poll_ms=500
report_every=10
rednet_chan=4200
